plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.gameaudiostream'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.gameaudiostream"
        minSdk 29          // Android 10 — required by AudioPlaybackCapture
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'

    // NOTE: Deliberately NO third-party audio or networking libraries.
    // - Audio capture/playback: android.media (AudioPlaybackCapture, AudioRecord, AudioTrack)
    // - Transport: java.net TCP sockets (standard Kotlin/Java)
}
